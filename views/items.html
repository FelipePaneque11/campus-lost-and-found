<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost &amp; Found</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body> 
    <main>
        <h1>Campus Lost &amp; Found</h1>
        <p><a href="/items/new">Report a found item</a></p>
        <h2>Found items</h2>

        <form action="/" method="get">
            <label for="search">Search by item name or location</label>
            <input type="search" name="search" id="search">
            <button type="submit">Search</button>
            <a href="/">Show all items</a>
        </form>

        <p id="search-summary">{{SEARCH_SUMMARY}}</p>

        <ul id="item-list"></ul>
    </main>

    <script src="/js/items.js" defer></script>
</body>
</html>

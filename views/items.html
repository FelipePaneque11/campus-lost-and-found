<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost &amp; Found</title>
</head>
<body> 
    <main>
        <h1>Campus Lost &amp; Found</h1>
        <p><a href="/items/new">Report a found item</a></p>
        <h2>Found items</h2>

        <form action="/" method="get">
            <label for="search">Search by item name or location</label>
            <input type="search" name="search" id="search">
            <button type="submit">Search</button>
            <a href="/">Show all items</a>
        </form>

        <p id="search-summary">{{SEARCH_SUMMARY}}</p>

        <ul id="item-list"></ul>
    </main>

    <script>
        async function loadItems() {
            const list = document.getElementById("item-list");

            try {
                const params = new URLSearchParams(window.location.search);
                const search = params.get("search") || "";

                document.getElementById("search").value = search;

                const response = await fetch("/api/items?search=" + encodeURIComponent(search));

                if (!response.ok) {
                    throw new Error("Could not load items");
                }

                const items = await response.json();

                if (items.length === 0) {
                    list.textContent = "No items found.";
                    return;
                }

                for (const item of items) {
                    const row = document.createElement("li");

                    const details = document.createElement("span");
                    details.textContent = item.name + " — " + item.location;

                    const claimLink = document.createElement("a");
                    claimLink.href = "/items/" + item.id + "/claim";
                    claimLink.textContent = "Claim this item";

                    row.append(details, " ", claimLink);
                    list.appendChild(row);
                }
            } catch (error) {
                list.textContent = "Could not load the items. Please refresh to try again.";
            }
        }

        loadItems();
    </script>
</body>
</html>

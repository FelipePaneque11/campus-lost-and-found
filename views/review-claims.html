<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review claims | Campus Lost &amp; Found</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main>
        <a href="/">Back to found items</a>
        <h1>Review pending claims</h1>
        <p id="message"></p>
        <div id="claims"></div>

        <template id="claim-card">
            <section>
                <h2></h2>
                <p></p>

                <form method="post">
                    <input type="hidden" name="csrfToken" value="{{CSRF_TOKEN}}">
                    <button name="decision" value="approved">Approve</button>
                    <button name="decision" value="rejected">Reject</button>
                </form>
            </section>
        </template>
    </main>

    <script src="/js/review-claims.js" defer></script>
</body>
</html>
